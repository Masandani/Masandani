<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سیستم حضور و حقوق کارگران</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Tahoma, Arial, sans-serif; background: #f0f4f8; color: #1a202c; direction: rtl; }
.app { max-width: 980px; margin: 0 auto; padding: 0 16px 60px; }

.app-header {
  background: linear-gradient(135deg, #1e3a5f, #2d6a9f);
  color: white; padding: 18px 24px;
  border-radius: 0 0 16px 16px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
  box-shadow: 0 4px 12px rgba(30,58,95,0.3);
}
.app-header h1 { font-size: 1.3rem; }
.month-nav { display: flex; align-items: center; gap: 10px; }
.month-nav button {
  background: rgba(255,255,255,0.2); border: none; color: white;
  padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-family: inherit;
}
.month-nav button:hover { background: rgba(255,255,255,0.35); }
.month-display { font-size: 1rem; font-weight: bold; min-width: 70px; text-align: center; }

.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tab-btn {
  flex: 1; padding: 11px; border: 2px solid #d0dce8; background: white;
  border-radius: 10px; cursor: pointer; font-size: 0.9rem; color: #4a5568;
  transition: all 0.2s; font-family: inherit;
}
.tab-btn.active { border-color: #2d6a9f; background: #2d6a9f; color: white; font-weight: bold; }
.tab-btn:hover:not(.active) { border-color: #2d6a9f; color: #2d6a9f; }

.section { display: none; }
.section.active { display: block; }

.card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
.form-card { border: 2px dashed #2d6a9f; }
.form-card h3 { color: #2d6a9f; margin-bottom: 16px; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; margin-bottom: 16px; }
.form-grid label { display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; color: #4a5568; }
.form-grid input, .form-grid select {
  padding: 9px 11px; border: 1.5px solid #d0dce8; border-radius: 8px;
  font-size: 0.92rem; font-family: inherit; transition: border-color 0.2s;
}
.form-grid input:focus, .form-grid select:focus { outline: none; border-color: #2d6a9f; }

.form-actions { display: flex; gap: 10px; }
.btn-primary { background: #2d6a9f; color: white; border: none; padding: 10px 22px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; font-family: inherit; }
.btn-primary:hover { background: #1e4f7a; }
.btn-secondary { background: #e2e8f0; color: #4a5568; border: none; padding: 10px 22px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-family: inherit; }
.btn-secondary:hover { background: #cbd5e0; }
.btn-sm { padding: 6px 12px !important; font-size: 0.82rem !important; }

.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.section-header h2 { font-size: 1.15rem; color: #1e3a5f; }
.days-info { font-size: 0.82rem; color: #718096; }

.empty-state { text-align: center; padding: 60px 20px; color: #718096; font-size: 0.95rem; }

/* Workers */
.workers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.worker-card { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-top: 4px solid #2d6a9f; }
.worker-name { font-size: 1rem; font-weight: bold; margin-bottom: 4px; }
.worker-role { color: #718096; font-size: 0.82rem; margin-bottom: 8px; }
.worker-wage { font-size: 0.88rem; color: #2d6a9f; margin: 6px 0; }
.worker-ot { font-size: 0.82rem; color: #718096; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; margin-bottom: 8px; font-weight: bold; }
.badge-daily { background: #ebf8ff; color: #2b6cb0; }
.badge-fixed { background: #f0fff4; color: #276749; }
.worker-actions { display: flex; gap: 8px; margin-top: 12px; }
.btn-edit { flex: 1; background: #ebf8ff; color: #2b6cb0; border: none; padding: 7px; border-radius: 7px; cursor: pointer; font-size: 0.82rem; font-family: inherit; }
.btn-edit:hover { background: #bee3f8; }
.btn-delete { flex: 1; background: #fff5f5; color: #c53030; border: none; padding: 7px; border-radius: 7px; cursor: pointer; font-size: 0.82rem; font-family: inherit; }
.btn-delete:hover { background: #fed7d7; }

/* Day picker */
.day-picker { display: flex; flex-wrap: wrap; gap: 6px; background: white; padding: 14px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 16px; }
.day-btn { width: 38px; height: 38px; border: 1.5px solid #d0dce8; border-radius: 8px; background: white; cursor: pointer; font-size: 0.88rem; color: #4a5568; font-family: inherit; transition: all 0.15s; }
.day-btn:hover { border-color: #2d6a9f; color: #2d6a9f; }
.day-btn.sel { background: #2d6a9f; color: white; border-color: #2d6a9f; font-weight: bold; }
.day-btn.has-data { border-color: #48bb78; }

.att-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.att-header h3 { color: #1e3a5f; }

table { width: 100%; border-collapse: collapse; }
th { background: #f7fafc; padding: 10px 12px; text-align: right; font-size: 0.88rem; color: #4a5568; border-bottom: 2px solid #e2e8f0; }
td { padding: 9px 12px; border-bottom: 1px solid #f0f4f8; font-size: 0.88rem; vertical-align: middle; }
tr.present { background: #f0fff4; }
tr.absent { background: #fff5f5; }

.toggle-group { display: flex; border-radius: 7px; overflow: hidden; border: 1.5px solid #d0dce8; width: fit-content; }
.toggle-btn { padding: 5px 13px; border: none; background: white; cursor: pointer; font-size: 0.82rem; color: #4a5568; font-family: inherit; }
.toggle-btn:first-child { border-left: 1px solid #d0dce8; }
.toggle-btn.tp { background: #48bb78; color: white; font-weight: bold; }
.toggle-btn.ta { background: #fc8181; color: white; font-weight: bold; }

.ot-input { width: 75px; padding: 5px 8px; border: 1.5px solid #d0dce8; border-radius: 7px; font-size: 0.88rem; text-align: center; font-family: inherit; }
.ot-input:focus { outline: none; border-color: #2d6a9f; }

/* Payroll */
.payroll-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-bottom: 20px; }
.payroll-card { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-top: 4px solid #2d6a9f; }
.payroll-name { font-size: 1rem; font-weight: bold; margin-bottom: 4px; }
.payroll-role { color: #718096; font-size: 0.82rem; margin-bottom: 8px; }
.detail-table { width: 100%; border-collapse: collapse; margin: 12px 0; }
.detail-table td { padding: 5px 2px; font-size: 0.85rem; border-bottom: 1px solid #f0f4f8; }
.detail-table td:last-child { text-align: left; color: #2d6a9f; font-weight: 500; }
.val-absent { color: #c53030 !important; }
.val-ot { color: #276749 !important; }
.payroll-total { margin-top: 12px; padding-top: 12px; border-top: 2px solid #e2e8f0; text-align: left; font-size: 0.95rem; }
.payroll-total strong { color: #1e3a5f; font-size: 1.05rem; }

.grand-total { background: linear-gradient(135deg, #1e3a5f, #2d6a9f); color: white; border-radius: 12px; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; font-size: 1.05rem; margin-bottom: 16px; }
.grand-total strong { font-size: 1.3rem; }

.btn-print { background: #276749; color: white; border: none; padding: 12px 28px; border-radius: 10px; cursor: pointer; font-size: 0.95rem; font-weight: bold; font-family: inherit; display: block; margin: 0 auto; }
.btn-print:hover { background: #1c4532; }

@media print {
  .tabs, .month-nav, .btn-print, .day-picker, .btn-primary, .btn-secondary, .worker-actions { display: none !important; }
  .app-header { background: #1e3a5f !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .payroll-card { break-inside: avoid; }
  #sec-workers, #sec-attendance { display: none !important; }
  #sec-payroll { display: block !important; }
}

@media (max-width: 600px) {
  .app-header { flex-direction: column; text-align: center; }
  .tabs { flex-direction: column; }
  .workers-grid, .payroll-cards { grid-template-columns: 1fr; }
  td, th { padding: 7px 6px; font-size: 0.8rem; }
}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>سیستم حضور و حقوق کارگران</h1>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">◀ قبلی</button>
      <span class="month-display" id="monthDisplay"></span>
      <button onclick="changeMonth(1)">بعدی ▶</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" onclick="showTab('workers', this)">👷 کارگران</button>
    <button class="tab-btn" onclick="showTab('attendance', this)">📋 حضور و غیاب</button>
    <button class="tab-btn" onclick="showTab('payroll', this)">💰 محاسبه حقوق</button>
  </nav>

  <!-- WORKERS -->
  <div id="sec-workers" class="section active">
    <div class="section-header">
      <h2>لیست کارگران</h2>
      <button class="btn-primary" onclick="openWorkerForm()">+ افزودن کارگر</button>
    </div>

    <div id="worker-form" class="card form-card" style="display:none">
      <h3 id="form-title">افزودن کارگر جدید</h3>
      <div class="form-grid">
        <label>نام و نام خانوادگی
          <input id="f-name" placeholder="مثال: علی محمدی">
        </label>
        <label>سمت / شغل
          <input id="f-role" placeholder="مثال: نگهبان، کارگر ساده">
        </label>
        <label>نوع قرارداد
          <select id="f-type" onchange="toggleWageFields()">
            <option value="daily">روزمزد</option>
            <option value="fixed">ماهیانه ثابت</option>
          </select>
        </label>
        <label id="daily-field">دستمزد روزانه (تومان)
          <input id="f-daily" type="number" placeholder="0" min="0">
        </label>
        <label id="fixed-field" style="display:none">حقوق ماهانه (تومان)
          <input id="f-monthly" type="number" placeholder="0" min="0">
        </label>
        <label>نرخ اضافه‌کاری (تومان/ساعت)
          <input id="f-ot" type="number" placeholder="0" min="0">
        </label>
      </div>
      <div class="form-actions">
        <button class="btn-primary" onclick="saveWorker()">ذخیره</button>
        <button class="btn-secondary" onclick="closeWorkerForm()">انصراف</button>
      </div>
    </div>

    <div id="workers-list"></div>
  </div>

  <!-- ATTENDANCE -->
  <div id="sec-attendance" class="section">
    <div class="section-header">
      <h2 id="att-title">حضور و غیاب</h2>
    </div>
    <div id="day-picker" class="day-picker"></div>
    <div id="att-content"></div>
  </div>

  <!-- PAYROLL -->
  <div id="sec-payroll" class="section">
    <div class="section-header">
      <h2 id="pay-title">گزارش حقوق</h2>
      <span class="days-info" id="pay-days"></span>
    </div>
    <div id="payroll-content"></div>
  </div>
</div>

<script>
// ── Storage ──────────────────────────────────────────────
const S = {
  workers: () => JSON.parse(localStorage.getItem('pw_workers') || '[]'),
  saveWorkers: v => localStorage.setItem('pw_workers', JSON.stringify(v)),
  att: () => JSON.parse(localStorage.getItem('pw_att') || '{}'),
  saveAtt: v => localStorage.setItem('pw_att', JSON.stringify(v)),
};

function attKey(y, m, d, wid) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}_${wid}`;
}

function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

function fmt(n) { return Number(n||0).toLocaleString('fa-IR'); }

// ── State ─────────────────────────────────────────────────
const today = new Date();
let curYear = today.getFullYear();
let curMonth = today.getMonth() + 1;
let curDay = today.getDate();
let editId = null;

// ── Month nav ─────────────────────────────────────────────
function changeMonth(dir) {
  curMonth += dir;
  if (curMonth < 1) { curMonth = 12; curYear--; }
  if (curMonth > 12) { curMonth = 1; curYear++; }
  updateMonthDisplay();
  renderAttendance();
  renderPayroll();
}

function updateMonthDisplay() {
  document.getElementById('monthDisplay').textContent = `${curMonth}/${curYear}`;
}

// ── Tabs ──────────────────────────────────────────────────
function showTab(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + id).classList.add('active');
  btn.classList.add('active');
  if (id === 'attendance') renderAttendance();
  if (id === 'payroll') renderPayroll();
}

// ── Workers ───────────────────────────────────────────────
function openWorkerForm(w) {
  editId = w ? w.id : null;
  document.getElementById('form-title').textContent = w ? 'ویرایش کارگر' : 'افزودن کارگر جدید';
  document.getElementById('f-name').value = w ? w.name : '';
  document.getElementById('f-role').value = w ? (w.role||'') : '';
  document.getElementById('f-type').value = w ? w.type : 'daily';
  document.getElementById('f-daily').value = w ? (w.dailyWage||'') : '';
  document.getElementById('f-monthly').value = w ? (w.monthlySalary||'') : '';
  document.getElementById('f-ot').value = w ? (w.overtimeRate||'') : '';
  toggleWageFields();
  document.getElementById('worker-form').style.display = 'block';
}

function closeWorkerForm() {
  document.getElementById('worker-form').style.display = 'none';
  editId = null;
}

function toggleWageFields() {
  const t = document.getElementById('f-type').value;
  document.getElementById('daily-field').style.display = t === 'daily' ? '' : 'none';
  document.getElementById('fixed-field').style.display = t === 'fixed' ? '' : 'none';
}

function saveWorker() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) return alert('نام کارگر را وارد کنید');
  const w = {
    id: editId || Date.now().toString(),
    name,
    role: document.getElementById('f-role').value.trim(),
    type: document.getElementById('f-type').value,
    dailyWage: document.getElementById('f-daily').value,
    monthlySalary: document.getElementById('f-monthly').value,
    overtimeRate: document.getElementById('f-ot').value,
  };
  let workers = S.workers();
  if (editId) workers = workers.map(x => x.id === editId ? w : x);
  else workers.push(w);
  S.saveWorkers(workers);
  closeWorkerForm();
  renderWorkers();
}

function deleteWorker(id) {
  if (!confirm('این کارگر حذف شود؟')) return;
  S.saveWorkers(S.workers().filter(w => w.id !== id));
  renderWorkers();
}

function renderWorkers() {
  const workers = S.workers();
  const el = document.getElementById('workers-list');
  if (!workers.length) {
    el.innerHTML = '<div class="empty-state">هیچ کارگری ثبت نشده است</div>';
    return;
  }
  el.innerHTML = '<div class="workers-grid">' + workers.map(w => `
    <div class="worker-card">
      <div class="worker-name">${esc(w.name)}</div>
      ${w.role ? `<div class="worker-role">${esc(w.role)}</div>` : ''}
      <span class="badge ${w.type === 'daily' ? 'badge-daily' : 'badge-fixed'}">${w.type === 'daily' ? 'روزمزد' : 'ماهیانه ثابت'}</span>
      <div class="worker-wage">${w.type === 'daily'
        ? `دستمزد روزانه: ${fmt(w.dailyWage)} تومان`
        : `حقوق ماهانه: ${fmt(w.monthlySalary)} تومان`}</div>
      ${w.overtimeRate > 0 ? `<div class="worker-ot">اضافه‌کاری: ${fmt(w.overtimeRate)} ت/ساعت</div>` : ''}
      <div class="worker-actions">
        <button class="btn-edit" onclick="openWorkerForm(${JSON.stringify(w).replace(/"/g,'&quot;')})">ویرایش</button>
        <button class="btn-delete" onclick="deleteWorker('${w.id}')">حذف</button>
      </div>
    </div>
  `).join('') + '</div>';
}

// ── Attendance ────────────────────────────────────────────
function renderAttendance() {
  document.getElementById('att-title').textContent = `حضور و غیاب — ${curMonth}/${curYear}`;
  const days = daysInMonth(curYear, curMonth);
  const att = S.att();
  const workers = S.workers();

  // ensure curDay valid for month
  if (curDay > days) curDay = days;

  // Day picker
  let dp = '';
  for (let d = 1; d <= days; d++) {
    const hasData = workers.some(w => att[attKey(curYear, curMonth, d, w.id)]?.status === 'present');
    dp += `<button class="day-btn${d === curDay ? ' sel' : ''}${hasData ? ' has-data' : ''}" onclick="selectDay(${d})">${d}</button>`;
  }
  document.getElementById('day-picker').innerHTML = dp;

  if (!workers.length) {
    document.getElementById('att-content').innerHTML = '<div class="empty-state">ابتدا کارگران را ثبت کنید</div>';
    return;
  }

  let rows = workers.map(w => {
    const key = attKey(curYear, curMonth, curDay, w.id);
    const rec = att[key] || { status: 'absent', overtime: 0 };
    const isPresent = rec.status === 'present';
    return `
      <tr class="${isPresent ? 'present' : 'absent'}" id="row-${w.id}">
        <td>${esc(w.name)}</td>
        <td>${esc(w.role||'—')}</td>
        <td>
          <div class="toggle-group">
            <button class="toggle-btn${isPresent ? ' tp' : ''}" onclick="setStatus('${w.id}','present')">حاضر</button>
            <button class="toggle-btn${!isPresent ? ' ta' : ''}" onclick="setStatus('${w.id}','absent')">غایب</button>
          </div>
        </td>
        <td><input class="ot-input" type="number" min="0" max="12" step="0.5" value="${rec.overtime||''}" placeholder="0" onchange="setOT('${w.id}', this.value)"></td>
      </tr>`;
  }).join('');

  document.getElementById('att-content').innerHTML = `
    <div class="card">
      <div class="att-header">
        <h3>روز ${curDay} — ماه ${curMonth}</h3>
        <button class="btn-secondary btn-sm" onclick="markAllPresent()">✓ همه حاضر</button>
      </div>
      <table>
        <thead><tr><th>نام کارگر</th><th>سمت</th><th>وضعیت</th><th>اضافه‌کاری (ساعت)</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function selectDay(d) {
  curDay = d;
  renderAttendance();
}

function setStatus(wid, status) {
  const att = S.att();
  const key = attKey(curYear, curMonth, curDay, wid);
  att[key] = { ...(att[key] || { overtime: 0 }), status };
  S.saveAtt(att);
  renderAttendance();
}

function setOT(wid, val) {
  const att = S.att();
  const key = attKey(curYear, curMonth, curDay, wid);
  att[key] = { ...(att[key] || { status: 'absent' }), overtime: val };
  S.saveAtt(att);
}

function markAllPresent() {
  const att = S.att();
  S.workers().forEach(w => {
    const key = attKey(curYear, curMonth, curDay, w.id);
    att[key] = { ...(att[key] || { overtime: 0 }), status: 'present' };
  });
  S.saveAtt(att);
  renderAttendance();
}

// ── Payroll ───────────────────────────────────────────────
function calcPay(w, att) {
  const days = daysInMonth(curYear, curMonth);
  let present = 0, otHours = 0;
  for (let d = 1; d <= days; d++) {
    const rec = att[attKey(curYear, curMonth, d, w.id)];
    if (rec) {
      if (rec.status === 'present') present++;
      if (rec.overtime) otHours += Number(rec.overtime);
    }
  }
  const otPay = otHours * Number(w.overtimeRate || 0);
  if (w.type === 'fixed') {
    const base = Number(w.monthlySalary || 0);
    return { base, presentDays: present, absentDays: days - present, otHours, otPay, total: base + otPay };
  }
  const base = present * Number(w.dailyWage || 0);
  const days_ = days;
  return { base, presentDays: present, absentDays: days_ - present, otHours, otPay, total: base + otPay };
}

function renderPayroll() {
  document.getElementById('pay-title').textContent = `گزارش حقوق — ${curMonth}/${curYear}`;
  const days = daysInMonth(curYear, curMonth);
  document.getElementById('pay-days').textContent = `تعداد روزهای ماه: ${days}`;
  const workers = S.workers();
  const att = S.att();

  if (!workers.length) {
    document.getElementById('payroll-content').innerHTML = '<div class="empty-state">ابتدا کارگران را ثبت کنید</div>';
    return;
  }

  const payrolls = workers.map(w => ({ w, ...calcPay(w, att) }));
  const grand = payrolls.reduce((s, p) => s + p.total, 0);

  const cards = payrolls.map(p => `
    <div class="payroll-card">
      <div class="payroll-name">${esc(p.w.name)}</div>
      ${p.w.role ? `<div class="payroll-role">${esc(p.w.role)}</div>` : ''}
      <span class="badge ${p.w.type === 'daily' ? 'badge-daily' : 'badge-fixed'}">${p.w.type === 'daily' ? 'روزمزد' : 'ماهیانه ثابت'}</span>
      <table class="detail-table">
        <tr><td>روزهای حاضر</td><td>${p.presentDays} روز</td></tr>
        <tr><td>روزهای غایب</td><td class="val-absent">${p.absentDays} روز</td></tr>
        <tr><td>${p.w.type === 'daily' ? 'دستمزد پایه' : 'حقوق پایه'}</td><td>${fmt(p.base)} تومان</td></tr>
        <tr><td>اضافه‌کاری</td><td>${p.otHours} ساعت</td></tr>
        <tr><td>مبلغ اضافه‌کاری</td><td class="val-ot">${fmt(p.otPay)} تومان</td></tr>
      </table>
      <div class="payroll-total">جمع کل: <strong>${fmt(p.total)} تومان</strong></div>
    </div>
  `).join('');

  document.getElementById('payroll-content').innerHTML = `
    <div class="payroll-cards">${cards}</div>
    <div class="grand-total">
      <span>جمع کل حقوق همه کارگران:</span>
      <strong>${fmt(grand)} تومان</strong>
    </div>
    <button class="btn-print" onclick="window.print()">🖨️ چاپ / ذخیره PDF</button>
  `;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──────────────────────────────────────────────────
updateMonthDisplay();
renderWorkers();
</script>
</body>
</html>
